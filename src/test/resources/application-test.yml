spring:
  datasource:
    # Persistence tests must never use the development database
    url: ${TEST_DB_URL:jdbc:mariadb://localhost:3306/researchflow_test}
    username: ${TEST_DB_USER:${DB_USER}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.mariadb.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

researchflow:
  seed:
    enabled: false
