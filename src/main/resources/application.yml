spring:
  application:
    name: ResearchFlow

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: researchflow-pool
      maximum-pool-size: 10
      # Fail fast if MariaDB is unreachable
      connection-timeout: 10000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # Non-destructive: do not create, update, or drop schema in this setup phase
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.rit.researchflow: INFO
    # Avoid noisy SQL parameter logging that could leak data
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
