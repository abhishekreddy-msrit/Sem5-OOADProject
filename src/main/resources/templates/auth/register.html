<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Create account</h1>
        <p class="muted">Register as a Student or Faculty member.</p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${#fields.hasGlobalErrors()}" class="flash-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div>
                <label for="role">Role</label>
                <select id="role" th:field="*{role}">
                    <option value="STUDENT">Student</option>
                    <option value="FACULTY">Faculty</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>
            <div>
                <label for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div>
                <label for="fullName">Full name</label>
                <input id="fullName" type="text" th:field="*{fullName}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div>
                <label for="department">Department</label>
                <input id="department" type="text" th:field="*{department}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
            </div>
            <div>
                <label for="identifierOrDesignation">Student ID / Faculty designation</label>
                <input id="identifierOrDesignation" type="text" th:field="*{identifierOrDesignation}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('identifierOrDesignation')}"
                     th:errors="*{identifierOrDesignation}"></div>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Register</button>
                <a th:href="@{/login}">Back to login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
